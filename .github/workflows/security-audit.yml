name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (production only)
        run: npm audit --production --audit-level=moderate || true

      - name: Run npm audit (all dependencies)
        run: npm audit --audit-level=high || true

      - name: Generate audit report
        run: |
          echo "# Security Audit Report" > audit-report.md
          echo "**Date:** $(date)" >> audit-report.md
          echo "" >> audit-report.md
          echo "## Production Dependencies" >> audit-report.md
          npm audit --production --json > prod-audit.json || true
          echo "\`\`\`" >> audit-report.md
          cat prod-audit.json >> audit-report.md
          echo "\`\`\`" >> audit-report.md
          echo "" >> audit-report.md
          echo "## All Dependencies" >> audit-report.md
          npm audit --json > all-audit.json || true
          echo "\`\`\`" >> audit-report.md
          cat all-audit.json >> audit-report.md
          echo "\`\`\`" >> audit-report.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.md
          retention-days: 30

      - name: Check for high severity vulnerabilities
        run: |
          HIGH_VULNS=$(npm audit --json | grep -o '"high":[0-9]*' | cut -d: -f2 || echo "0")
          CRITICAL_VULNS=$(npm audit --json | grep -o '"critical":[0-9]*' | cut -d: -f2 || echo "0")
          echo "High severity vulnerabilities: $HIGH_VULNS"
          echo "Critical severity vulnerabilities: $CRITICAL_VULNS"
          if [ "$CRITICAL_VULNS" -gt "0" ]; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
