name: CD - Deploy Beta to Kubernetes

on:
  workflow_run:
    workflows:
      - "CI - Build Beta Docker Image"
    types:
      - completed
    branches:
      - beta

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="1.$(date +'%Y.%m.%d')-beta"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Patch image tag in deployment manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s~scholtz2/aramid-bridge-web-app:.*~scholtz2/aramid-bridge-web-app:$VERSION~g" k8s/deployment-beta.yaml
          echo "Updated manifest:"
          grep "image:" k8s/deployment-beta.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment-beta.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/zb-web-beta-deployment -n zb-web-beta --timeout=120s

      - name: Commit updated deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment-beta.yaml
          git diff --staged --quiet || git commit -m "ci: update beta image to ${{ steps.version.outputs.version }}"
          git push
