name: CI/CD - Beta

on:
  push:
    branches:
      - main

jobs:
  build:
    name: CI - Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="1.$(date +'%Y.%m.%d')-beta"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: scholtz2/aramid-bridge-web-app:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD - Deploy to Kubernetes (beta)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Patch image tag in deployment manifest
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s~scholtz2/aramid-bridge-web-app:.*~scholtz2/aramid-bridge-web-app:$VERSION~g" k8s/deployment-beta.yaml
          echo "Updated manifest:"
          grep "image:" k8s/deployment-beta.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/deployment-beta.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/zb-web-beta-deployment -n zb-web-beta --timeout=120s

      - name: Commit updated deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment-beta.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: update beta image to ${{ needs.build.outputs.version }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
